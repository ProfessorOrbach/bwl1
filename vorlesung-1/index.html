<style>
:root{--rot:#C00009;--orange:#E24300;--violett:#9D167A;--ink:#151518;--ink2:#55555f;--line:#e3e3ea}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#f1f1f5;color:var(--ink);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
body{display:grid;place-items:center;padding:20px}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:6px;background:linear-gradient(100deg,var(--rot),var(--orange) 48%,var(--violett))}
main{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px 30px 28px;box-shadow:0 10px 30px -18px rgba(20,20,30,.35)}
.eyebrow{margin:0 0 10px;font:600 12px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--rot)}
h1{margin:0 0 8px;font-size:26px;line-height:1.15;letter-spacing:-.02em}
p{margin:0 0 20px;color:var(--ink2);line-height:1.5}
form{display:flex;gap:10px}
input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border:1px solid #d2d2dc;border-radius:10px}
input:focus{outline:2px solid var(--rot);outline-offset:1px;border-color:transparent}
button{font:inherit;font-weight:700;font-size:16px;padding:12px 18px;border:0;border-radius:10px;background:var(--rot);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#fehler{margin:14px 0 0;color:var(--rot);font-weight:600}
</style>

  var LS='bwl1-schluessel';
  function bytes(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function b64(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
  function merke(v){try{localStorage.setItem(LS,v)}catch(e){try{sessionStorage.setItem(LS,v)}catch(e2){}}}
  function gemerkt(){try{return localStorage.getItem(LS)||sessionStorage.getItem(LS)}catch(e){return null}}
  function vergiss(){try{localStorage.removeItem(LS);sessionStorage.removeItem(LS)}catch(e){}}
  function oeffne(roh){
    return crypto.subtle.importKey('raw',roh,'AES-GCM',false,['decrypt']).then(function(k){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(D.iv)},k,bytes(D.ct));
    }).then(function(klar){
      var html=new TextDecoder().decode(klar);
      document.open();document.write(html);document.close();
    });
  }
  /* document.open() ersetzt das Dokument nur zuverlässig, wenn es fertig geladen ist */
  function nachLaden(fn){ if(document.readyState==='complete') setTimeout(fn,0); else window.addEventListener('load',function(){ setTimeout(fn,0); }); }
  var r=gemerkt();
  if(r){ nachLaden(function(){ oeffne(bytes(r)).catch(function(){ vergiss(); }); }); }
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault();
    var btn=document.getElementById('b'),fe=document.getElementById('fehler');
    btn.disabled=true; fe.hidden=true;
    var pw=new TextEncoder().encode(document.getElementById('pw').value);
    crypto.subtle.importKey('raw',pw,'PBKDF2',false,['deriveBits']).then(function(basis){
      return crypto.subtle.deriveBits({name:'PBKDF2',salt:bytes(D.salt),iterations:D.iter,hash:'SHA-256'},basis,256);

      return oeffne(bits).then(function(){ merke(b64(bits)); });
    }).catch(function(){ fe.hidden=false; btn.disabled=false; });
  });
